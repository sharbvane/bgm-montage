name: 缺陷报告
description: 报告可复现的行为异常、渲染或质量检查问题
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "请勿提交 API Key、Cookie、私有素材、完整本地路径或未脱敏日志。"
  - type: input
    id: version
    attributes:
      label: BGM Montage 版本
      description: 例如 v1.4.6 或提交 SHA。
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 运行环境
      description: 操作系统、Python、FFmpeg/ffprobe 版本及使用的素材来源模式。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 最小复现步骤
      description: 请用脱敏后的命令与最小输入说明复现路径。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果与实际结果
    validations:
      required: true
