  short_description: "Plan, source, render, and QA BGM-led Pixabay montages"
  default_prompt: "Use $bgm-montage v1.3 to derive a task-specific visual profile from my request, read-only references, and BGM; intelligently reuse or search Pixabay footage; prioritize aesthetic quality, whole-film cohesion, visual match cuts, and low repetition; render without overwriting prior runs; optionally create an editable JianYing draft; and deliver only after automatic QA passes. If CLIP is unavailable, use structural fallback only when I explicitly allow it."

